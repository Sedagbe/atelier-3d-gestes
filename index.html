<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier 3D - pilotage par la main</title>
<style>
:root{--acc:#38bdf8;--panel:rgba(12,20,36,.74);--line:rgba(148,197,255,.16);--tx:#e6eefc;--mut:#8ea3c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 50% 42%,#14233f 0%,#0a1020 55%,#05080f 100%)}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}

/* Colonne gauche : liste des objets */
#left{position:fixed;left:16px;top:16px;bottom:88px;width:236px;padding:14px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#left h1{margin:2px 8px 6px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
#left h1 small{display:block;color:var(--mut);font-size:11px;text-transform:none;letter-spacing:0;margin-top:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:transparent;min-height:46px;transition:.15s}
.item:hover{background:rgba(56,189,248,.08)}
.item .n{width:20px;font-size:11px;color:var(--mut);text-align:center}
.item .e{font-size:20px}
.item .t{display:flex;flex-direction:column;font-size:14px;line-height:1.15}
.item .t small{color:var(--mut);font-size:11px;margin-top:2px}
.item.on{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.5)}

/* Colonne droite */
#right{position:fixed;right:16px;top:16px;bottom:88px;width:292px;display:flex;flex-direction:column;gap:12px}
#cam{padding:8px;position:relative}
#preview{width:100%;aspect-ratio:4/3;border-radius:10px;background:#050a14;display:block}
#hud{margin-top:8px;font-size:13px;position:relative;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);overflow:hidden}
#hudbar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc)}
#legend{padding:10px 12px;font-size:12px;display:grid;gap:5px}
#legend div{display:flex;gap:8px;align-items:baseline}
#legend b{white-space:nowrap}
#legend span{color:var(--mut)}
#card{padding:14px;flex:1;overflow:auto;min-height:120px}
.ctitle{display:flex;gap:10px;align-items:center}
.ctitle>span{font-size:30px}
.ctitle h2{margin:0;font-size:17px}
.ctitle small{color:var(--mut)}
.res{font-size:13px;line-height:1.45;color:#c9d6ee;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips span{font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.28)}
.sel{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.45);border-radius:12px;padding:10px 12px;margin-bottom:12px;position:relative}
.sel b{font-size:14px}
.sel p{margin:6px 0;font-size:12.5px;line-height:1.45;color:#d6e2f7}
.sel .mat{font-size:11.5px;color:var(--acc)}
.mini{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:8px;padding:3px 8px;font-size:11px}
.plist .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist .lbl{width:100%}
.plist button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:8px;padding:6px 9px;font-size:12px;min-height:32px}
.plist button.on{background:rgba(56,189,248,.28);border-color:var(--acc)}

/* Barre d'outils */
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;z-index:5}
#bar button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px;min-height:46px;font-size:14px;transition:.15s}
#bar button:hover{background:rgba(56,189,248,.12)}
#bar button.on{background:rgba(56,189,248,.28);border-color:var(--acc)}

[data-action].hover{outline:2px solid var(--acc);outline-offset:1px;background:rgba(56,189,248,.22)!important}

/* Curseur main */
#cursor{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:60;display:none}
#ring{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;
  background:conic-gradient(var(--acc) calc(var(--p,0)*360deg),rgba(255,255,255,.22) 0);
  -webkit-mask:radial-gradient(circle,transparent 19px,#000 20px,#000 27px,transparent 28px);
          mask:radial-gradient(circle,transparent 19px,#000 20px,#000 27px,transparent 28px)}
#dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--acc)}

#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;padding:9px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.25s;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Ecran de démarrage */
#start{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(5,8,15,.82);backdrop-filter:blur(8px)}
#start .box{width:min(560px,92vw);padding:28px;text-align:left}
#start h1{margin:0 0 6px;font-size:26px}
#start p{color:#b9c8e4;line-height:1.5;font-size:14px}
#start .grid{display:grid;gap:7px;margin:14px 0 18px;font-size:13.5px}
#start .grid div{display:flex;gap:10px}
#start .grid b{min-width:92px}
#start .row{display:flex;gap:10px;flex-wrap:wrap}
.cta{border:0;background:var(--acc);color:#04202e;font-weight:700;padding:13px 20px;border-radius:12px;font-size:15px}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.06);padding:13px 18px;border-radius:12px;font-size:14px}
#startMsg{margin-top:12px;font-size:13px;color:#fbbf24;min-height:18px}

@media (max-width:1050px){#legend{display:none}#right{width:240px}#left{width:200px}}
</style>

<canvas id="gl"></canvas>

<aside id="left" class="glass">
  <h1>Atelier 3D<small>10 équipements à explorer</small></h1>

</aside>

<aside id="right">
  <div id="cam" class="glass">

  <button data-action="xray" id="b-xray">🔍 Transparence</button>
  <button data-action="spin" id="b-spin">🔄 Rotation auto</button>
  <button data-action="reset">🎯 Recentrer</button>
  <button data-action="next" title="Objet suivant (→)">▶</button>
</nav>

<div id="cursor"><div id="ring"></div><div id="dot"></div></div>
<div id="toast" class="glass"></div>

<div id="start">

    <div class="row">

      <button class="ghost" id="btnMouse">Continuer avec la souris</button>
    </div>
    <div id="startMsg"></div>
  </div>
</div>

function makeGeo(t, a) {
  switch (t) {
    case 'box': return new THREE.BoxGeometry(a[0], a[1], a[2]);
    case 'cyl': return new THREE.CylinderGeometry(a[0], a[1], a[2], a[3] || 24);
    case 'sph': return new THREE.SphereGeometry(a[0], 28, 18);
    case 'cone': return new THREE.ConeGeometry(a[0], a[1], a[2] || 32);
    case 'tor': return new THREE.TorusGeometry(a[0], a[1], 14, 56, a[2] || PI * 2);
    case 'cap': return new THREE.CapsuleGeometry(a[0], a[1], 6, 16);
  }
}

function buildObject(def) {
  const g = new THREE.Group();
  g.position.y = def.y || 0;
  const parts = [];
  def.parts.forEach((pd, i) => {
    const pg = new THREE.Group();
    pg.userData = { i, def: pd, ex: new THREE.Vector3(...pd.ex), meshes: [] };
    pd.items.forEach(it => {
      const [t, a, p0, r0, s = null, c, glowItem] = it;
      const p = p0 ?? [0, 0, 0], r = r0 ?? [0, 0, 0];
      const geo = makeGeo(t, a);
      const col = c ?? pd.c;
      const glow = pd.glow || glowItem === true;
      const mat = new THREE.MeshStandardMaterial({ color: col, metalness: pd.metal ?? 0.3, roughness: pd.rough ?? 0.45 });
      if (glow) { mat.emissive = new THREE.Color(col); mat.emissiveIntensity = 0.9; }
      mat.userData = { op: pd.op ?? 1, base: glow ? 0.9 : 0, baseEm: mat.emissive.clone() };
      if (mat.userData.op < 1) { mat.transparent = true; mat.opacity = mat.userData.op; }
      const m = new THREE.Mesh(geo, mat);
      m.position.set(p[0], p[1], p[2]);
      m.rotation.set(r[0], r[1], r[2]);
      if (s) m.scale.set(s[0], s[1], s[2]);
      m.userData.part = pg;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), edgeMat);
      edges.visible = false; m.add(edges); m.userData.edges = edges;
      pg.add(m); pg.userData.meshes.push(m);
    });
    g.add(pg); parts.push(pg);
  });
  g.userData.parts = parts;
  return g;
}

    const mode = pg === selPart ? 2 : pg === hoverPart ? 1 : 0;
    pg.userData.meshes.forEach(m => {
      const mt = m.material;
      if (mode === 0) { mt.emissive.copy(mt.userData.baseEm); mt.emissiveIntensity = mt.userData.base; }
      else { mt.emissive.set(0x38bdf8); mt.emissiveIntensity = mode === 2 ? 0.75 : 0.4; }
    });

}
function applyXray() {

    if (xray) { mt.transparent = true; mt.opacity = 0.22; mt.depthWrite = false; }
    else { mt.transparent = mt.userData.op < 1; mt.opacity = mt.userData.op; mt.depthWrite = true; }
    m.userData.edges.visible = xray;
  }));
}

const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const video = $('video'), pv = $('preview'), pctx = pv.getContext('2d');
const cursor = $('cursor'), hudtxt = $('hudtxt'), hudbar = $('hudbar');
let landmarker = null, lastVT = -1;

const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function analyze(lm) {
  const w = lm[0];
  const [i, m, r, p] = [[6, 8], [10, 12], [14, 16], [18, 20]].map(([pip, tip]) => d2(lm[tip], w) > d2(lm[pip], w) * 1.12);
  let g = 'other';
  if (!i && !m && !r && !p) g = 'fist';
  else if (i && !m && !r && !p) g = 'point';
  else if (i && m && !r && !p) g = 'peace';
  else if (i && m && r && !p) g = 'three';
  else if (i && m && r && p) g = 'open';
  return { g, lm };
}

let cand = null, candN = 0, gest = null, gestSince = 0, fired = false, lastFire = 0, lastSwipe = 0;
let palmPrev = null, swipeH = [], zoomRef = null;
let ptrActive = false, ptr = { x: 0, y: 0 }, hoverEl = null;
let dwellKey = null, dwellStart = 0, dwellLock = 0;

function stable(g) {
  if (g === cand) candN++; else { cand = g; candN = 1; }
  if (candN >= 3 && g !== gest) { gest = g; gestSince = performance.now(); fired = false; palmPrev = null; swipeH = []; }
  return gest;
}
const LABEL = { null: '👋 Montrez votre main', point: '☝️ Pointeur', fist: '✊ Rotation', peace: '✌️ Vue éclatée…', three: '3️⃣ Transparence…', open: '🖐 Balayez pour changer', zoom: '🙌 Zoom', other: '…' };
function hud(g, now) {
  hudtxt.textContent = LABEL[g] ?? LABEL.other;
  let p = 0;
  if (g === 'peace' || g === 'three') p = fired ? 1 : Math.min(1, (now - gestSince) / 600);
  hudbar.style.width = (p * 100) + '%';
}
function setHover(el, pp) {
  if (hoverEl !== el) { if (hoverEl) hoverEl.classList.remove('hover'); hoverEl = el; if (el) el.classList.add('hover'); }
  if (hoverPart !== pp) { hoverPart = pp; updatePaint(); }
}
function endPointer() {
  if (!ptrActive) return;
  ptrActive = false; cursor.style.display = 'none'; setHover(null, null); dwellKey = null;
}
function doPointer(lm, now) {
  const tx = clamp((1 - lm[8].x - 0.12) / 0.76, 0, 1) * innerWidth;
  const ty = clamp((lm[8].y - 0.1) / 0.7, 0, 1) * innerHeight;
  if (!ptrActive) { ptr.x = tx; ptr.y = ty; }
  ptr.x += (tx - ptr.x) * 0.4; ptr.y += (ty - ptr.y) * 0.4;
  ptrActive = true;
  cursor.style.display = 'block';
  cursor.style.transform = `translate(${ptr.x}px,${ptr.y}px)`;
  const el = document.elementFromPoint(ptr.x, ptr.y);
  const act = el && el.closest ? el.closest('[data-action]') : null;
  let key = null, hEl = null, pp = null;
  if (act) { key = act.dataset.action; hEl = act; }
  else if (el === canvas) { pp = pickPart(ptr.x, ptr.y); if (pp) key = 'part:' + pp.userData.i; }
  setHover(hEl, pp);
  if (now < dwellLock) key = null;
  if (key !== dwellKey) { dwellKey = key; dwellStart = now; }
  const p = key ? Math.min(1, (now - dwellStart) / 1100) : 0;
  cursor.style.setProperty('--p', p);
  if (key && p >= 1) {
    dwellLock = now + 900; dwellKey = null; cursor.style.setProperty('--p', 0);
    doAction(key);
  }
}
function drawPreview(hands) {
  const W = pv.width, Hh = pv.height;
  pctx.save(); pctx.translate(W, 0); pctx.scale(-1, 1); pctx.drawImage(video, 0, 0, W, Hh); pctx.restore();
  hands.forEach(lm => {
    pctx.strokeStyle = 'rgba(56,189,248,.95)'; pctx.lineWidth = 2;
    CONN.forEach(([a, b]) => { pctx.beginPath(); pctx.moveTo((1 - lm[a].x) * W, lm[a].y * Hh); pctx.lineTo((1 - lm[b].x) * W, lm[b].y * Hh); pctx.stroke(); });
    pctx.fillStyle = '#fff';
    lm.forEach(p => { pctx.beginPath(); pctx.arc((1 - p.x) * W, p.y * Hh, 2.5, 0, 7); pctx.fill(); });
  });
}

function handleHands(hands, now) {
  drawPreview(hands);
  if (!hands.length) {
    stable(null); hud(null, now); grabbing = false; zoomRef = null; palmPrev = null; endPointer(); return;
  }
  const A = hands.map(analyze);
  let g = A[0].g;
  if (A.length > 1 && A[0].g === 'open' && A[1].g === 'open') g = 'zoom';
  g = stable(g);
  hud(g, now);
  if (g !== 'point') endPointer();
  if (g !== 'fist') { grabbing = false; palmPrev = null; }
  if (g !== 'zoom') zoomRef = null;

  if (g === 'point') doPointer(A[0].lm, now);
  else if (g === 'fist') {
    const lm = A[0].lm, c = { x: 1 - lm[9].x, y: lm[9].y };
    if (palmPrev) {
      stage.rotation.y += (c.x - palmPrev.x) * 7;
      stage.rotation.x = clamp(stage.rotation.x + (c.y - palmPrev.y) * 5, -1.3, 1.3);
    }
    palmPrev = c; grabbing = true;
  }
  else if (g === 'peace' || g === 'three') {
    if (!fired && now - gestSince > 600 && now - lastFire > 800) {
      fired = true; lastFire = now; doAction(g === 'peace' ? 'explode' : 'xray');
    }
  }
  else if (g === 'open') {
    const x = 1 - A[0].lm[9].x;
    swipeH.push({ t: now, x });
    while (swipeH.length && now - swipeH[0].t > 450) swipeH.shift();
    if (now - lastSwipe > 1000 && now - gestSince > 250 && swipeH.length > 3) {
      const xs = swipeH.map(s => s.x);
      if (Math.max(...xs) - Math.min(...xs) > 0.28) {
        const dir = swipeH[swipeH.length - 1].x > swipeH[0].x ? 1 : -1;
        lastSwipe = now; swipeH = []; doAction(dir > 0 ? 'next' : 'prev');
      }
    }
  }
  else if (g === 'zoom') {
    const a = A[0].lm[9], b = A[1].lm[9];
    const dist = Math.max(0.05, d2(a, b));
    if (!zoomRef) zoomRef = { d: dist, cam: camTarget };
    camTarget = clamp(zoomRef.cam * zoomRef.d / dist, 3.2, 18);
  }
}

  $('btnCam').disabled = true;
  try {
    msg.textContent = 'Chargement du modèle de détection de main…';
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = delegate => ({ baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
    try { landmarker = await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch (e) { landmarker = await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
    msg.textContent = 'Autorisez l\'accès à la caméra…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    $('start').style.display = 'none';
    hudtxt.textContent = LABEL.null;
    toast('Caméra activée : montrez votre main');
  } catch (e) {
    console.error(e);
    landmarker = null;
    $('btnCam').disabled = false;
    msg.textContent = 'Caméra indisponible (' + (e && e.message ? e.message : e) + '). Ouvrez la page via http://localhost (voir les instructions) ou continuez avec la souris.';
  }
}
$('btnCam').addEventListener('click', startCamera);
$('btnMouse').addEventListener('click', () => { $('start').style.display = 'none'; });

/* =====================================================================
   BOUCLE DE RENDU
   ===================================================================== */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();

  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { const r = landmarker.detectForVideo(video, now); handleHands(r.landmarks || [], now); }
    catch (e) { console.warn(e); }
  }

  if (appearT < 1 && curGroup) {
    appearT = Math.min(1, appearT + dt * 2.2);
    curGroup.scale.setScalar(0.05 + 0.95 * (1 - Math.pow(1 - appearT, 3)));
  }
  expF += ((exploded ? 1 : 0) - expF) * Math.min(1, dt * 4);
  if (curGroup) curGroup.userData.parts.forEach(pg => pg.position.copy(pg.userData.ex).multiplyScalar(expF));
  if (spin && !grabbing && !drag) stage.rotation.y += dt * 0.3;

  camDist += (camTarget - camDist) * Math.min(1, dt * 6);
  camera.position.set(0, camDist * 0.28, camDist);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}

selectObject(0);
syncButtons();
frame();
</script>
